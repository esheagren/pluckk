<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'">
<style>
  html, body { margin: 0; background: transparent; font: 12px -apple-system, system-ui, sans-serif; color: var(--text, #333); }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  svg { display: block; }
  .ask [data-part] { cursor: pointer; }
  .ask [data-part]:hover { opacity: 0.8; }
  .note { font-size: 11px; color: var(--muted, #999); text-align: center; }
  .note a { color: inherit; }
  .credit { font-size: 9.5px; opacity: 0.75; }
</style>
<style id="masks"></style>
</head>
<body>
<div class="wrap"><div id="host"></div><div class="note" id="caption"></div><div class="note credit" id="credit"></div></div>
<script src="/modules/pluckk-module.js"></script>
<script>
// anatomy@1 — anatomical figures with named parts, drawn from real illustrations (see CREDITS.md).
// props: { figure: "skeleton" | "muscles" | "muscles-back" | "heart" | "brain" | "cell",
//          highlight?: "<part id>",   // prompt: light this part up
//          target?: "<part id>",      // respond: the part to click; scored 1 if right, 0 if not
//          height?: number }
// Each figure is its own script (figures/<name>.js): the artwork as SVG, every named part tagged
// data-part. A part is lit by tinting it where it actually shows: the figure is repainted in black
// with the part in white, and that is the mask for a wash of colour laid over the greyed drawing.
// So a part that sits behind another is tinted only where it's visible, and its drawn lines stay.
const NS = 'http://www.w3.org/2000/svg';
const host = document.getElementById('host');
let props = {}, slot = 'prompt', fig = null, svg = null, art = null, picked = null, revealed = false;

const el = (name, attrs = {}) => { const e = document.createElementNS(NS, name); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
const cssColour = (name, fallback) => getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback;

function mount() {
  host.innerHTML = fig.svg;
  svg = host.querySelector('svg');
  // The artwork goes in one group, so it can be greyed as a whole and repainted as a mask.
  art = el('g', { id: 'art' });
  while (svg.firstChild) art.appendChild(svg.firstChild);
  const defs = el('defs', { id: 'own' });
  // Grey, and lifted towards white, so a wash laid over it keeps its own colour.
  const grey = el('filter', { id: 'grey', 'color-interpolation-filters': 'sRGB' });
  grey.appendChild(el('feColorMatrix', { type: 'saturate', values: '0' }));
  const lift = el('feComponentTransfer', { id: 'lift' });
  for (const ch of ['feFuncR', 'feFuncG', 'feFuncB']) lift.appendChild(el(ch, { type: 'linear' }));
  grey.appendChild(lift);
  defs.appendChild(grey);
  svg.appendChild(defs);
  svg.appendChild(art);
  svg.appendChild(el('g', { id: 'washes' }));
  document.getElementById('caption').textContent = fig.caption || '';
  const credit = document.getElementById('credit');
  credit.textContent = 'Illustration: ' + fig.credit;
  credit.title = fig.source;
}

// Which parts are lit, and in what colour.
function lit() {
  if (slot === 'prompt') return props.highlight ? [[props.highlight, cssColour('--accent', '#c9a66b')]] : [];
  if (!revealed && !picked) return [];
  const out = [];
  if (picked && picked !== props.target) out.push([picked, cssColour('--warning', '#e5a14b')]);
  if (props.target) out.push([props.target, cssColour('--success', '#27ae60')]);
  return out;
}

function draw() {
  const [x, y, w, h] = fig.view;
  const width = Math.min(document.body.clientWidth || 600, 640);
  const height = Math.min(props.height || fig.height || 340, width * h / w);
  svg.setAttribute('width', height * w / h); svg.setAttribute('height', height);
  svg.classList.toggle('ask', slot === 'respond' && !picked && !revealed);
  const parts = lit().filter(([id]) => fig.parts[id]);
  const defs = svg.querySelector('#own');
  for (const m of defs.querySelectorAll('mask')) m.remove();
  const washes = svg.querySelector('#washes');
  washes.textContent = '';
  let css = '';
  // With something lit, the rest of the drawing steps back to grey: paler on a dark card, a
  // little darker on a white one so it doesn't fade into it.
  const dark = document.documentElement.dataset.theme === 'dark';
  for (const f of svg.querySelectorAll('#lift > *')) {
    f.setAttribute('slope', dark ? '0.5' : '0.6');
    f.setAttribute('intercept', dark ? '0.47' : '0.33');
  }
  if (parts.length) art.setAttribute('filter', 'url(#grey)'); else art.removeAttribute('filter');
  parts.forEach(([id, colour], n) => {
    const mask = el('mask', { id: `m${n}`, maskUnits: 'userSpaceOnUse', x, y, width: w, height: h });
    mask.appendChild(el('rect', { x, y, width: w, height: h, fill: '#000' }));
    const copy = art.cloneNode(true);
    copy.removeAttribute('id'); copy.removeAttribute('filter');
    mask.appendChild(copy);
    defs.appendChild(mask);
    // Everything black, the part white; a shape with no fill (or no outline) keeps none.
    css += `#m${n} [data-d]{fill:#000 !important;stroke:#000 !important;opacity:1 !important}
      #m${n} [data-part~="${id}"][data-d], #m${n} [data-part~="${id}"] [data-d]{fill:#fff !important;stroke:#fff !important}
      #m${n} [data-nf][data-d][data-d][data-d]{fill:none !important}
      #m${n} [data-ns][data-d][data-d][data-d]{stroke:none !important}\n`;
    const wash = el('rect', { x, y, width: w, height: h, fill: colour, mask: `url(#m${n})` });
    wash.style.mixBlendMode = 'multiply';
    wash.style.pointerEvents = 'none';
    washes.appendChild(wash);
  });
  document.getElementById('masks').textContent = css;
}

function partAt(target) {
  const tagged = target.closest('[data-part]');
  if (!tagged || !host.contains(tagged)) return null;
  // The last name is the most particular one (the nucleolus, inside the nucleus).
  const names = tagged.getAttribute('data-part').split(/\s+/).filter((n) => fig.parts[n]);
  return names.length ? names[names.length - 1] : null;
}

host.addEventListener('click', (e) => {
  if (slot !== 'respond' || picked || revealed || !fig) return;
  const part = partAt(e.target);
  if (!part) return;
  picked = part;
  const right = picked === props.target;
  const name = fig.parts[picked];
  draw();
  Pluckk.respond({ picked }, right ? 1 : 0, right ? `Right: ${name}` : `That's the ${name.toLowerCase()}`);
});

function load(name, done) {
  if (!/^[a-z-]+$/.test(name || '')) { done(false); return; }
  const s = document.createElement('script');
  s.src = `figures/${name}.js`;
  s.onload = () => done(!!window.AnatomyFigure);
  s.onerror = () => done(false);
  document.head.appendChild(s);
}

Pluckk.on('init', (m) => {
  props = m.props || {}; slot = m.slot; revealed = !!m.revealed;
  load(props.figure, (ok) => {
    if (!ok) { document.body.textContent = `No figure called "${props.figure}".`; Pluckk.ready(); return; }
    fig = window.AnatomyFigure;
    mount(); draw(); Pluckk.ready();
  });
});
Pluckk.on('reveal', () => { revealed = true; if (fig) draw(); });
Pluckk.on('theme', () => { if (fig) draw(); });
</script>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'">
<style>
  html, body { margin: 0; background: transparent; font: 12px -apple-system, system-ui, sans-serif; color: var(--text, #333); }
  .wrap { display: flex; justify-content: center; }
  svg { display: block; }
  .part .fill { fill: var(--base-fill); stroke: var(--base-stroke); stroke-width: 1.2; }
  .part .line { fill: none; stroke: var(--base-line); stroke-linecap: round; }
  .part .hit { fill: none; stroke: transparent; stroke-linecap: round; }
  .part .dot { fill: var(--base-line); }
  .part.on .fill { fill: var(--accent, #c9a66b); stroke: var(--accent, #c9a66b); }
  .part.on .line { stroke: var(--accent, #c9a66b); }
  .part.on .dot { fill: var(--accent, #c9a66b); }
  .part.right .fill { fill: var(--success, #27ae60); stroke: var(--success, #27ae60); }
  .part.right .line { stroke: var(--success, #27ae60); }
  .part.wrong .fill { fill: var(--warning, #e5a14b); stroke: var(--warning, #e5a14b); }
  .part.wrong .line { stroke: var(--warning, #e5a14b); }
  .ask .part { cursor: pointer; }
  .ask .part:hover .fill { fill: var(--hover-fill); }
  .ask .part:hover .line { stroke: var(--hover-line); }
  .outline { fill: var(--body-fill); stroke: var(--body-stroke); stroke-width: 1; }
  .label { font-size: 13px; font-weight: 600; fill: var(--text, #333); paint-order: stroke; stroke: var(--surface, #fff); stroke-width: 3px; }
</style>
</head>
<body>
<div class="wrap"><svg id="s"></svg></div>
<script src="/modules/pluckk-module.js"></script>
<script>
// anatomy@1 — schematic figures with named parts.
// props: { figure: "skeleton" | "muscles" | "heart" | "brain" | "cell",
//          highlight?: "<part id>",   // prompt: light this part up
//          target?: "<part id>",      // respond: the part to click; scored 1 if right, 0 if not
//          height?: number }
// The drawings are schematic, made for recognising and locating parts, not for medical detail.
const L = (x1, y1, x2, y2, w) => ({ k: 'line', d: `M${x1} ${y1} L${x2} ${y2}`, w });
const P = (d, w) => ({ k: 'line', d, w });           // a stroked path
const F = (d) => ({ k: 'fill', d });                 // a filled path
const E = (cx, cy, rx, ry) => F(`M${cx - rx} ${cy} a${rx} ${ry} 0 1 0 ${2 * rx} 0 a${rx} ${ry} 0 1 0 ${-2 * rx} 0 Z`);
const both = (f) => [...f(1), ...f(-1)];              // the same shape on the left and right side
const mx = (x, s) => 150 + s * (x - 150);            // mirror about the body's midline (x = 150)

const body = [ // a front-facing silhouette for the skeleton and muscle figures
  'M150 12 a36 42 0 1 1 -0.1 0 Z',
  'M136 92 h28 v26 h-28 Z',
  'M96 122 Q150 108 204 122 L214 150 L206 332 Q150 352 94 332 L86 150 Z',
  ...[1, -1].map(s => `M${mx(98, s)} 126 L${mx(80, s)} 132 L${mx(62, s)} 340 L${mx(76, s)} 344 L${mx(100, s)} 160 Z`),
  ...[1, -1].map(s => `M${mx(100, s)} 330 L${mx(146, s)} 340 L${mx(132, s)} 600 L${mx(104, s)} 600 Z`),
];

const FIGURES = {
  skeleton: { view: [0, 0, 300, 620], outline: body, parts: {
    skull: ['Skull (cranium)', [E(150, 52, 32, 38)]],
    mandible: ['Mandible (jaw)', [F('M126 78 Q150 116 174 78 L168 76 Q150 102 132 76 Z')]],
    clavicle: ['Clavicle (collarbone)', both(s => [L(mx(146, s), 126, mx(104, s), 120, 6)])],
    scapula: ['Scapula (shoulder blade)', both(s => [F(`M${mx(104, s)} 128 L${mx(124, s)} 132 L${mx(118, s)} 168 Z`)])],
    sternum: ['Sternum (breastbone)', [F('M145 132 h10 v66 l-5 8 l-5 -8 Z')]],
    ribs: ['Ribs (rib cage)', both(s => [0, 1, 2, 3, 4, 5].map(i => P(`M${mx(146, s)} ${142 + i * 14} Q${mx(110, s)} ${144 + i * 14} ${mx(108, s)} ${166 + i * 14}`, 4)))],
    spine: ['Vertebral column (spine)', [L(150, 96, 150, 124, 7), L(150, 210, 150, 318, 8)]],
    humerus: ['Humerus', both(s => [L(mx(104, s), 130, mx(92, s), 236, 9)])],
    radius: ['Radius', both(s => [L(mx(88, s), 244, mx(72, s), 330, 5)])],
    ulna: ['Ulna', both(s => [L(mx(97, s), 244, mx(85, s), 332, 5)])],
    hand: ['Bones of the hand', both(s => [E(mx(77, s), 352, 9, 15)])],
    pelvis: ['Pelvis (hip bone)', [F('M104 312 Q150 296 196 312 Q206 346 176 358 Q160 340 150 344 Q140 340 124 358 Q94 346 104 312 Z')]],
    femur: ['Femur (thigh bone)', both(s => [L(mx(126, s), 352, mx(120, s), 470, 11)])],
    patella: ['Patella (kneecap)', both(s => [E(mx(120, s), 482, 7, 8)])],
    tibia: ['Tibia (shinbone)', both(s => [L(mx(124, s), 494, mx(124, s), 586, 8)])],
    fibula: ['Fibula', both(s => [L(mx(111, s), 496, mx(113, s), 584, 4)])],
    foot: ['Bones of the foot', both(s => [E(mx(118, s), 602, 14, 8)])],
  } },
  muscles: { view: [0, 0, 300, 620], outline: body, parts: {
    sternocleidomastoid: ['Sternocleidomastoid', both(s => [F(`M${mx(140, s)} 88 L${mx(146, s)} 88 L${mx(146, s)} 126 L${mx(138, s)} 126 Z`)])],
    trapezius: ['Trapezius', both(s => [F(`M${mx(136, s)} 104 Q${mx(116, s)} 116 ${mx(100, s)} 124 L${mx(132, s)} 124 Z`)])],
    deltoid: ['Deltoid', both(s => [E(mx(96, s), 146, 14, 22)])],
    pectoralis: ['Pectoralis major', both(s => [F(`M${mx(148, s)} 132 Q${mx(116, s)} 128 ${mx(108, s)} 150 Q${mx(116, s)} 186 ${mx(148, s)} 184 Z`)])],
    biceps: ['Biceps brachii', both(s => [E(mx(90, s), 200, 8, 28)])],
    forearm: ['Forearm flexors', both(s => [E(mx(78, s), 284, 7, 34)])],
    abdominis: ['Rectus abdominis (abs)', [F('M136 192 h28 v118 q-14 10 -28 0 Z')]],
    oblique: ['External oblique', both(s => [F(`M${mx(134, s)} 196 L${mx(112, s)} 190 L${mx(104, s)} 290 L${mx(132, s)} 300 Z`)])],
    quadriceps: ['Quadriceps', both(s => [F(`M${mx(108, s)} 360 Q${mx(110, s)} 340 ${mx(138, s)} 350 Q${mx(140, s)} 420 ${mx(130, s)} 470 Q${mx(110, s)} 470 ${mx(108, s)} 360 Z`)])],
    adductors: ['Adductors (inner thigh)', both(s => [F(`M${mx(140, s)} 352 L${mx(146, s)} 352 L${mx(140, s)} 430 Z`)])],
    tibialis: ['Tibialis anterior', both(s => [E(mx(114, s), 536, 6, 40)])],
    calf: ['Gastrocnemius (calf)', both(s => [E(mx(128, s), 522, 6, 30)])],
  } },
  heart: { view: [0, 0, 400, 420], parts: {
    svc: ['Superior vena cava', [F('M110 12 h36 v120 h-36 Z')]],
    ivc: ['Inferior vena cava', [F('M96 258 h32 v120 h-32 Z')]],
    aorta: ['Aorta', [P('M196 178 C186 70 300 28 312 112 L314 170', 30)]],
    pulmonary: ['Pulmonary trunk', [P('M226 196 C236 150 262 128 300 120', 26)]],
    ra: ['Right atrium', [E(132, 196, 50, 54)]],
    la: ['Left atrium', [E(282, 196, 40, 30)]],
    rv: ['Right ventricle', [F('M110 238 Q150 222 246 236 L232 392 Q160 352 110 238 Z')]],
    lv: ['Left ventricle', [F('M246 236 Q300 220 330 252 Q332 340 232 392 Z')]],
  }, labels: [[70, 410, 'patient’s right'], [270, 410, 'patient’s left']] },
  brain: { view: [0, 0, 500, 380], clip: 'M40 170 C40 40 200 18 290 24 C410 32 470 110 466 196 C462 262 410 280 360 262 C330 300 250 300 200 292 C140 290 60 270 40 170 Z', parts: {
    frontal: ['Frontal lobe', [F('M0 0 L232 0 L252 168 L190 196 L60 236 L0 236 Z')]],
    parietal: ['Parietal lobe', [F('M232 0 L384 0 L372 150 L252 168 Z')]],
    occipital: ['Occipital lobe', [F('M384 0 L500 0 L500 270 L372 240 L372 150 Z')]],
    temporal: ['Temporal lobe', [F('M60 236 L190 196 L252 168 L372 150 L372 240 L340 320 L80 320 Z')]],
    cerebellum: ['Cerebellum', [E(400, 292, 66, 40)]],
    brainstem: ['Brainstem', [F('M300 266 h38 l-4 108 h-30 Z')]],
  }, unclipped: ['cerebellum', 'brainstem'], labels: [[30, 370, 'front'], [440, 370, 'back']] },
  cell: { view: [0, 0, 500, 380], parts: {
    membrane: ['Cell membrane', [P('M250 18 C400 18 486 100 486 190 C486 290 390 362 250 362 C110 362 14 290 14 190 C14 100 100 18 250 18 Z', 8)]],
    nucleus: ['Nucleus', [E(220, 180, 64, 58)]],
    nucleolus: ['Nucleolus', [E(236, 172, 18, 16)]],
    er: ['Endoplasmic reticulum', [0, 1, 2].map(i => P(`M${300 + i * 16} ${116 - i * 8} q12 30 0 60 q-12 30 0 60 q12 30 0 60`, 5))],
    golgi: ['Golgi apparatus', [0, 1, 2, 3].map(i => P(`M${352 + i * 9} ${226 - i * 4} q34 22 0 70`, 5))],
    mitochondrion: ['Mitochondrion', [F('M86 270 a26 14 -25 1 1 46 -20 a26 14 -25 1 1 -46 20 Z'), F('M374 104 a26 14 20 1 1 44 18 a26 14 20 1 1 -44 -18 Z')]],
    lysosome: ['Lysosome', [E(300, 310, 13, 13), E(150, 96, 11, 11)]],
    centrosome: ['Centrosome', [F('M150 300 h18 v6 h-18 Z'), F('M168 290 h6 v18 h-6 Z')]],
  } },
};

const svg = document.getElementById('s');
let props = {}, slot = 'prompt', fig = null, picked = null, revealed = false;

function draw() {
  const [x, y, w, h] = fig.view;
  const width = Math.min(document.body.clientWidth || 600, 560);
  const height = Math.min(props.height || 340, width * h / w);
  svg.setAttribute('viewBox', `${x} ${y} ${w} ${h}`);
  svg.setAttribute('width', height * w / h); svg.setAttribute('height', height);
  svg.classList.toggle('ask', slot === 'respond' && !picked && !revealed);
  let out = '';
  if (fig.clip) out += `<defs><clipPath id="c"><path d="${fig.clip}"/></clipPath></defs>`;
  for (const d of fig.outline || []) out += `<path class="outline" d="${d}"/>`;
  const stateOf = (id) => {
    if (slot === 'prompt') return id === props.highlight ? 'on' : '';
    if (revealed || picked) {
      if (id === props.target) return 'right';
      if (id === picked) return 'wrong';
    }
    return '';
  };
  const order = Object.keys(fig.parts);
  for (const id of order) {
    const [, shapes] = fig.parts[id];
    const clipped = fig.clip && !(fig.unclipped || []).includes(id);
    out += `<g class="part ${stateOf(id)}" data-part="${id}"${clipped ? ' clip-path="url(#c)"' : ''}>`;
    for (const s of shapes) {
      if (s.k === 'fill') out += `<path class="fill" d="${s.d}"/>`;
      else out += `<path class="hit" d="${s.d}" stroke-width="${s.w + 12}"/><path class="line" d="${s.d}" stroke-width="${s.w}"/>`;
    }
    out += '</g>';
  }
  if (fig.clip) out += `<path d="${fig.clip}" fill="none" stroke="var(--base-stroke)" stroke-width="1.5"/>`;
  for (const [lx, ly, t] of fig.labels || []) out += `<text x="${lx}" y="${ly}" font-size="12" fill="var(--muted,#999)">${t}</text>`;
  svg.innerHTML = out;
}

function theme() {
  const dark = document.documentElement.dataset.theme === 'dark';
  const r = document.documentElement.style;
  r.setProperty('--base-fill', dark ? 'rgba(255,255,255,0.10)' : 'rgba(0,0,0,0.07)');
  r.setProperty('--base-stroke', dark ? 'rgba(255,255,255,0.32)' : 'rgba(0,0,0,0.28)');
  r.setProperty('--base-line', dark ? 'rgba(255,255,255,0.55)' : 'rgba(0,0,0,0.45)');
  r.setProperty('--hover-fill', dark ? 'rgba(255,255,255,0.22)' : 'rgba(0,0,0,0.16)');
  r.setProperty('--hover-line', dark ? 'rgba(255,255,255,0.85)' : 'rgba(0,0,0,0.75)');
  r.setProperty('--body-fill', dark ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.025)');
  r.setProperty('--body-stroke', dark ? 'rgba(255,255,255,0.12)' : 'rgba(0,0,0,0.10)');
}

svg.addEventListener('click', (e) => {
  if (slot !== 'respond' || picked || revealed) return;
  const g = e.target.closest('[data-part]');
  if (!g) return;
  picked = g.dataset.part;
  const right = picked === props.target;
  const name = fig.parts[picked][0];
  draw();
  Pluckk.respond({ picked }, right ? 1 : 0, right ? `Right: ${name}` : `That's the ${name.toLowerCase()}`);
});

Pluckk.on('init', (m) => {
  props = m.props || {}; slot = m.slot; revealed = !!m.revealed;
  fig = FIGURES[props.figure];
  if (!fig) { document.body.textContent = `No figure called "${props.figure}".`; Pluckk.ready(); return; }
  theme(); draw(); Pluckk.ready();
});
Pluckk.on('reveal', () => { revealed = true; if (fig) draw(); });
Pluckk.on('theme', () => { theme(); if (fig) draw(); });
</script>
</body>
</html>

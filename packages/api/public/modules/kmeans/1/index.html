<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'">
<style>
  html, body { margin: 0; background: transparent; }
  canvas { display: block; width: 100%; border-radius: 10px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="controls"></div>
<script src="../../pluckk-module.js"></script>
<script src="../../pluckk-stepper.js"></script>
<script>
// kmeans@1 — steps through k-means on a small made-up dataset.
// props: { k = 3, points = 60, seed = 4, init = "random" | "kmeans++", height = 300, autoplay = false }
// Each round is two steps: assign (every point takes its nearest centroid's colour, and the
// plane is shaded by which centroid is nearest) and update (each centroid slides to the mean of
// its points). It stops when an assignment changes nothing.
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const COLORS = ['#e07a5f', '#3d9be9', '#81b29a', '#c9a66b', '#b07cc6', '#e5c14b'];
let W = 600, H = 300, player = null;

function rng(seed) {   // mulberry32: the same props always give the same run
  let a = seed >>> 0;
  return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function gauss(r) { return Math.sqrt(-2 * Math.log(1 - r())) * Math.cos(2 * Math.PI * r()); }
const d2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
const nearest = (p, cs) => cs.reduce((best, c, j) => (d2(p, c) < d2(p, cs[best]) ? j : best), 0);

function simulate({ k = 3, points = 60, seed = 4, init = 'random' }) {
  const r = rng(seed);
  const blobs = Array.from({ length: k }, () => ({ x: 0.15 + 0.7 * r(), y: 0.15 + 0.7 * r(), s: 0.05 + 0.05 * r() }));
  const pts = Array.from({ length: points }, (_, i) => {
    const b = blobs[i % k];
    return { x: Math.min(0.97, Math.max(0.03, b.x + b.s * gauss(r))), y: Math.min(0.97, Math.max(0.03, b.y + b.s * gauss(r))) };
  });
  let cs;
  if (init === 'kmeans++') {
    cs = [{ ...pts[Math.floor(r() * pts.length)] }];
    while (cs.length < k) {
      const w = pts.map((p) => Math.min(...cs.map((c) => d2(p, c))));
      let t = r() * w.reduce((a, b) => a + b, 0), j = 0;
      while ((t -= w[j]) > 0) j++;
      cs.push({ ...pts[j] });
    }
  } else {
    const picked = new Set();
    while (picked.size < k) picked.add(Math.floor(r() * pts.length));
    cs = [...picked].map((j) => ({ ...pts[j] }));
  }
  const sse = (labels, cents) => pts.reduce((s, p, i) => s + d2(p, cents[labels[i]]), 0);
  const steps = [
    { caption: `The data: ${points} points with no labels. We want k = ${k} groups.`, pts, cs: [], labels: null, from: null },
    { caption: init === 'kmeans++'
        ? `Start: pick ${k} centroids with k-means++, each new one likely to be far from those already chosen.`
        : `Start: pick ${k} random points as the starting centroids (★).`, pts, cs, labels: null, from: null },
  ];
  let labels = null;
  for (let round = 1; round <= 20; round++) {
    const next = pts.map((p) => nearest(p, cs));
    const changed = labels ? next.filter((l, i) => l !== labels[i]).length : points;
    if (labels && changed === 0) {
      steps.push({ caption: `Round ${round}: no point changes cluster, so k-means has converged after ${round - 1} rounds. Total squared distance ${sse(labels, cs).toFixed(3)}.`, pts, cs, labels, from: null, done: true });
      break;
    }
    labels = next;
    steps.push({ caption: `Round ${round}, assign: every point joins its nearest centroid${round > 1 ? ` (${changed} switched)` : ''}. The shading shows each centroid's territory.`,
                 pts, cs, labels, from: null, shade: true });
    const moved = cs.map((c, j) => {
      const mine = pts.filter((_, i) => labels[i] === j);
      return mine.length ? { x: mine.reduce((s, p) => s + p.x, 0) / mine.length, y: mine.reduce((s, p) => s + p.y, 0) / mine.length } : c;
    });
    steps.push({ caption: `Round ${round}, update: each centroid moves to the mean of its points. Total squared distance ${sse(labels, cs).toFixed(3)} → ${sse(labels, moved).toFixed(3)}.`,
                 pts, cs: moved, labels, from: cs, shade: true });
    cs = moved;
  }
  return steps;
}

function draw(step, t) {
  const dark = document.documentElement.dataset.theme === 'dark';
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = dark ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.025)';
  ctx.fillRect(0, 0, W, H);
  const X = (x) => 12 + x * (W - 24), Y = (y) => 12 + y * (H - 24);
  const cs = step.from ? step.cs.map((c, j) => ({ x: step.from[j].x + (c.x - step.from[j].x) * t, y: step.from[j].y + (c.y - step.from[j].y) * t })) : step.cs;
  if (step.shade) {   // nearest-centroid territories, in coarse cells
    const cell = 10;
    for (let x = 0; x < W; x += cell) for (let y = 0; y < H; y += cell) {
      const p = { x: (x + cell / 2 - 12) / (W - 24), y: (y + cell / 2 - 12) / (H - 24) };
      ctx.fillStyle = COLORS[nearest(p, cs) % COLORS.length] + (dark ? '1c' : '16');
      ctx.fillRect(x, y, cell, cell);
    }
  }
  if (step.labels && !step.from) {   // spokes from each point to its centroid while assigning
    ctx.lineWidth = 0.6;
    step.pts.forEach((p, i) => {
      const c = cs[step.labels[i]];
      ctx.strokeStyle = COLORS[step.labels[i] % COLORS.length] + '55';
      ctx.beginPath(); ctx.moveTo(X(p.x), Y(p.y)); ctx.lineTo(X(c.x), Y(c.y)); ctx.stroke();
    });
  }
  step.pts.forEach((p, i) => {
    ctx.fillStyle = step.labels ? COLORS[step.labels[i] % COLORS.length] : (dark ? '#bbb' : '#777');
    ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), 3.6, 0, Math.PI * 2); ctx.fill();
  });
  if (step.from) {   // trail from where each centroid was
    ctx.setLineDash([3, 3]); ctx.lineWidth = 1.2;
    step.from.forEach((c, j) => {
      ctx.strokeStyle = COLORS[j % COLORS.length];
      ctx.beginPath(); ctx.moveTo(X(c.x), Y(c.y)); ctx.lineTo(X(cs[j].x), Y(cs[j].y)); ctx.stroke();
    });
    ctx.setLineDash([]);
  }
  cs.forEach((c, j) => star(X(c.x), Y(c.y), COLORS[j % COLORS.length], dark));
}
function star(x, y, color, dark) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? 4.5 : 10, a = -Math.PI / 2 + i * Math.PI / 5;
    i ? ctx.lineTo(x + r * Math.cos(a), y + r * Math.sin(a)) : ctx.moveTo(x + r * Math.cos(a), y + r * Math.sin(a));
  }
  ctx.closePath(); ctx.fillStyle = color; ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = dark ? '#1c1c1e' : '#fff'; ctx.stroke();
}

function size(props) {
  W = document.body.clientWidth || 600; H = props.height || 300;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

let props = {};
Pluckk.on('init', (m) => {
  props = m.props || {};
  size(props);
  const steps = simulate(props);
  player = PluckkStepper.mount(document.getElementById('controls'), { steps, render: draw, autoplay: !!props.autoplay });
  Pluckk.ready();
});
Pluckk.on('theme', () => player && player.redraw());
let lastW = 0;
new ResizeObserver(() => {
  if (!player || document.body.clientWidth === lastW) return;
  lastW = document.body.clientWidth; size(props); player.redraw();
}).observe(document.body);
</script>
</body>
</html>

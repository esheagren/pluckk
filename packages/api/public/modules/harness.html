<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Module Harness</title>
<style>
  :root { --bg: #fafafa; --card: #fff; --text: #2d3436; --muted: #999; --rule: #dedede; }
  :root[data-theme="dark"] { --bg: #080808; --card: #1c1c1e; --text: #f5f5f5; --muted: #777; --rule: #2e2e30; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 13px -apple-system, system-ui, sans-serif; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .card { background: var(--card); border: 1px solid var(--rule); border-radius: 14px; padding: 20px; max-width: 640px; }
  iframe { width: 100%; border: 0; display: block; height: 80px; }
  pre { color: var(--muted); font-size: 11px; white-space: pre-wrap; max-width: 640px; }
</style>
</head>
<body>
<!-- Try a module the way a card would show it: /modules/harness.html?m=geo-map/1 -->
<div class="bar">
  <input id="m" size="16"> <select id="s"></select>
  <button id="go">Load</button> <button id="rv">Reveal</button> <button id="th">Light / dark</button>
</div>
<div class="card"><iframe id="f" sandbox="allow-scripts allow-same-origin"></iframe></div>
<pre id="log"></pre>
<script>
  const q = new URLSearchParams(location.search);
  const f = document.getElementById('f'), log = document.getElementById('log');
  const m = document.getElementById('m'), s = document.getElementById('s');
  m.value = q.get('m') || 'geo-map/1';
  let samples = [], dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = () => dark
    ? { dark: true, text: '#f5f5f5', muted: '#777777', accent: '#c9a66b', surface: '#1c1c1e', rule: '#2e2e30', success: '#27ae60', warning: '#e5a14b' }
    : { dark: false, text: '#2d3436', muted: '#a0a0a0', accent: '#c9a66b', surface: '#ffffff', rule: '#dedede', success: '#27ae60', warning: '#e5a14b' };
  const send = (msg) => f.contentWindow.postMessage({ pluckk: msg }, '*');
  const note = (x) => { log.textContent = JSON.stringify(x) + '\n' + log.textContent; };
  window.addEventListener('message', (e) => {
    const msg = e.data && e.data.pluckk; if (!msg) return;
    if (e.source !== f.contentWindow) return;
    if (msg.type === 'ready' || msg.type === 'resize') f.style.height = msg.height + 'px';
    note(msg);
  });
  async function load() {
    samples = await (await fetch(`${m.value}/samples.json`)).json();
    s.innerHTML = samples.map((x, i) => `<option value="${i}">${i}: ${x.slot} ${JSON.stringify(x.props).slice(0, 60)}</option>`).join('');
    open(+q.get('i') || 0);
  }
  function open(i) {
    s.value = i;
    const sample = samples[i];
    f.onload = () => send({ type: 'init', slot: sample.slot, props: sample.props, theme: theme(), revealed: false, capabilities: {} });
    f.src = `${m.value}/index.html?${Date.now()}`;
  }
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  document.getElementById('go').onclick = load;
  s.onchange = () => open(+s.value);
  document.getElementById('rv').onclick = () => send({ type: 'reveal' });
  document.getElementById('th').onclick = () => { dark = !dark; document.documentElement.dataset.theme = dark ? 'dark' : 'light'; send({ type: 'theme', theme: theme() }); };
  load();
</script>
</body>
</html>
